[project]
name = "pca"
version = "0.1.0"
description = "Personal Context AI — a private, persistent personal-context assistant with temporal memory"
requires-python = ">=3.13,<3.14"

# Exact pins, not ranges (ADR-004 rationale extended to dependencies).
# Values below were resolved from the actual working environment on 2026-08-11,
# not copied from documentation. graphiti-core and langgraph churn quickly and a
# range would admit a breaking release silently between sessions.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "asyncpg==0.31.0",
    "SQLAlchemy==2.0.52",
    "neo4j==6.2.0",
    "graphiti-core==0.29.3",
    "langgraph==1.2.11",
    "google-genai==2.18.1",
    # Required on Windows: the OS ships no IANA tz database, so zoneinfo cannot
    # resolve any zone without this. ADR-011 depends on it.
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pca"]

[tool.pytest.ini_options]
# pythonpath lets the suite run without installing the package first.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
